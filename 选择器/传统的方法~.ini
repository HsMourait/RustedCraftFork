[core]
name:传统的方法
price:0
maxHp:1000
radius:30
mass:1000000
overrideAndReplace:commandCenter
isBuilder:true
isBuilding:true


[hiddenAction_initSelfExtraExp]
autoTriggerOnEvent:created
addResources:selfExtraPrice=300000000

[action_1]
text:S.P.A.R.K
description:来自月球的机器人势力-\n擅长大规模复制和生产
convertTo:SPARK T1指挥官
ai_isHighPriority:true
showMessageToAllPlayers:来自月球的庞然大物进入战场!
isLocked:if self.timeAlive<5
isLockedMessage:换了方式也逃不掉5s哦


[action_2]
text:fighter_地球联合政府
description:地球上的几个大型国家联合而成的政府-\n科技似乎不算发达
convertTo:开局指挥中心
ai_isHighPriority:true
showMessageToAllPlayers:地球联合政府势力介入!
isLocked:if self.timeAlive<5
isLockedMessage:换了方式也逃不掉5s哦
[graphics]
image:选择器.png
scaleImagesTo:60
[attack]
canAttack:false

[movement]
movementType:BUILDING 