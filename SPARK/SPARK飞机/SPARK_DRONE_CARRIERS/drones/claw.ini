[core]
copyFrom: _drone.template
name: claw_drone
displayText: 「利爪」无人战斗机
displayDescription: [无人机]\n-通用型战斗机,配备轻型机炮

mass: 100
radius: 6

maxHp: 100
energyMax: 0

[graphics]
image: claw.png

[attack]
maxAttackRange: 80
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
isFixedFiring: true

[turret_1]
#laserTurret
x: 0
y: 2
idleDir:0

projectile: 1
invisible: true
delay: 60
aimOffsetSpread: 0
turnSpeed: 0

[projectile_1]
directDamage: 30
life: 70
speed: 10
frame: 5
drawSize: 0.7

[movement]
movementType: AIR
moveSpeed: 2.6
moveAccelerationSpeed: 0.2
moveDecelerationSpeed: 4
landOnGround: false
targetHeight: 20
targetHeightDrift: 5
maxTurnSpeed: 2
turnAcceleration: 2
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_back]
autoTrigger: if (not self.hasActiveWaypoint(type="loadInto")) and (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25) or (not memory.deck.parent.isAttacking()))

[hiddenAction_attack]
autoTrigger: if (not (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25))) and (not self.hasActiveWaypoint(type="attack")) and memory.deck.parent.isAttacking()