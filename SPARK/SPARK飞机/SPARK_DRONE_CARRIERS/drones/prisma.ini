[core]
copyFrom: _drone.template
name: prisma_drone
displayText: 「棱镜」无人战斗机
displayDescription: [无人机]\n-通用型战斗机,配备小型光束武器

mass: 100
radius: 5

maxHp: 70
energyMax: 0

[graphics]
image: prisma.png

[attack]
maxAttackRange: 60
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
isFixedFiring: true

[turret_1]
#laserTurret
x: 0
y: 2
idleDir:0

projectile: beam
size: 2
delay: 10
aimOffsetSpread: 0
turnSpeed: 0

[projectile_beam]
life: 15

instant:true
instantReuseLast: true
instantReuseLast_alsoChangeTurretAim: true
moveWithParent: true

beamImage:      SHARED:/beam3.png
beamImageEnd:   SHARED:/beam1_end.png
beamImageStart: SHARED:/beam1_start.png
beamImageOffsetRate: 2

explodeEffect: NONE
explodeEffectOnShield: NONE
shieldDamageMultiplier: 0.75

sweepOffsetFromTargetRadius: 0

#=== others ===
directDamage: 4
color: #42f2f5
teamColorRatio_sourceRatio:0.8
teamColorRatio:0.5

[movement]
movementType: AIR
moveSpeed: 3
moveAccelerationSpeed: 1
moveDecelerationSpeed: 4
landOnGround: false
targetHeight: 20
targetHeightDrift: 5
maxTurnSpeed: 4
turnAcceleration: 2
slowDeathFall: false
reverseSpeedPercentage: 0

[hiddenAction_back]
autoTrigger: if (not self.hasActiveWaypoint(type="loadInto")) and (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25) or (not memory.deck.parent.isAttacking()))

[hiddenAction_attack]
autoTrigger: if (not (memory.deck.hasFlag(id=24) or memory.deck.hasFlag(id=25))) and (not self.hasActiveWaypoint(type="attack")) and memory.deck.parent.isAttacking()