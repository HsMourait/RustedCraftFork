[core]
copyFrom:ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:unit-behaviors.template
name:人民突击队
displayText:人民突击队
displayDescription:[对地][反步兵/建筑]\n-由伏罗希洛夫军事学院解锁的先进步兵\n-装备有波波沙冲锋枪\n-其对步兵的伤害与其到目标距离成反比
displayDescription_ja = [地球] [反宿泊/建築] \ n-n-advanced歩兵は、ヴォロヒロフ軍アカデミーによってロックされていません。

defineUnitMemory:float maxAttackRange
price:110
armour:10
[graphics]
image_back:人民突击队.png
image_turret:步枪(c).png
turretImageScale:0.6



[attack]
maxAttackRange:120
canAttack:true
canAttackFlyingUnits:false
canAttackLandUnits:true
canAttackUnderwaterUnits:false
showRangeUIGuide:true
#isMelee:true
#meleeEngangementDistance:${attack.maxAttackRange}


[turret_1]
x:0
y:5
shoot_sound:missile_fire
shoot_light:#FFAA0000
recoilOffset:-3
recoilOutTime:2
recoilReturnTime:10
delay:30

[projectile_1]
life:100
directDamage:15

drawSize:0.7
lightSize:0.3
lightColor:#AAFF6666
speed:7
explodeEffect:smoke
image:子弹.png


[hiddenAction_伤害修正]
autoTrigger:if self.isAttacking()
buildSpeed:0s
setUnitStats:shootDamageMultiplier=1/(distanceBetween(self,attacking)/120)




[movement]
moveSpeed:0.72

[ai]
buildPriority:0.8





