[core]
copyFrom                  : ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:unit-behaviors.template
name                      : 工程师
displayText               : 工程师
displayText_ja:工兵
displayDescription        : [维修][不可攻击]\n-优秀的工程人员, 可以加速建造或维修建筑\n-启用自动维修后可以维修装甲单位\n-可以布设对装甲单位效果拔群的地雷\n-可以建设容纳两人的小型碉堡
displayDescription_ja = [メンテナンス] [攻撃の失敗] \ n未払いのエンジニアリング担当者は、建設またはメンテナンスの建物を加速できます\ n-自動メンテナンスを修復することができます。装甲ユニットの効果\ n-canは、2つを収容できる小さなバンカーを構築する

defineUnitMemory          : float maxAttackRange
price                     : 100
isBuilder                 : true
nanoBuildSpeed            : 0.3
armour                    : 1
canRepairUnitsOnlyWithTags: tank,building
canRepairUnits            : true
autoRepair                : true
canRepairBuildings        : true

[hiddenAction_间谍伪装标签]
autoTrigger:true
temporarilyAddTags:可被间谍伪装,间谍外观_工程师

[graphics]
image_turret:扳手.png
turretImageScale:0.6



[attack]
maxAttackRange            : 40
canAttack                 : true
canAttackFlyingUnits      : false
canAttackLandUnits        : true
canAttackUnderwaterUnits  : false
showRangeUIGuide          : true
isMelee                   : true
removeOnAttack            : true
canOnlyAttackUnitsWithTags: canBeOccupy


[canBuild_1]
name:terM.A.O反装甲地雷

[canBuild_2]
name:小地堡
pos:1

[turret_1]
x               : 0
y               : 5
recoilOffset    : 5

[turret_2] 
x                         : 0
y                         : 0
image                     : NONE
projectile                : 2


[projectile_2]
life: 20
image:NONE.png
directDamage:0
convertHitToSourceTeam:true

[ai]
buildPriority: 0.8

[hiddenAction_autoRepair]
autoTriggerOnEvent              : newWaypointGivenByPlayer
requireConditional              : if self.hasActiveWaypoint(type='loadInto') and thisActionTarget.maxHp!=thisActionTarget.hp
clearAllWaypoints               : true
addWaypoint_type                : repair
addWaypoint_target_fromReference: thisActionTarget



