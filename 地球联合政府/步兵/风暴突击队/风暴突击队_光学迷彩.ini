[core]
copyFrom                         : ROOT:地球联合政府/步兵/风暴突击队/风暴突击队.ini,ROOT:unit-behaviors.template
name                             : t2风暴突击队_光学迷彩
showOnMinimapToEnemies           : true
energyMax                        : 1
showInEditor                     : true
#canOnlyBeAttackedByUnitsWithTags: NOBODY
#energyStartingPercentage        : 1
radius                           : 14
selfRegenRate                    : 0
energyRegen:0
[movement]
movementType:AIR
moveSpeed:1.2
landOnGround:true
targetHeight:30

[attack]
canAttack:false

[graphics]
isVisibleToEnemies:true
image_back:NONE
image:滑翔.png
image_turret:NONE
scaleImagesTo:30

[hiddenAction_return]
autoTrigger:if self.isAtGroundHeight and self.resource(type="flytime",greaterThan=5)
convertTo:t2风暴突击队
setResourcesWithLogic:flytime=0

[resource_flytime]
hidden:true

[action_putBoob]
isLocked:true
isLockedMessage:无法在飞行状态下放置炸弹
[action_光学迷彩]
isVisible:false

[hiddenAction_addFlytime]
autoTrigger:if self.resource(type="flytime",lessThan=6)
addResources:flytime=1



