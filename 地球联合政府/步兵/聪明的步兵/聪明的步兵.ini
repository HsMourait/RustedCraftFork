[core]
copyFrom          : ROOT:地球联合政府/步兵/t1步兵基础/t1步兵基础.ini,ROOT:unit-behaviors.template
name              : 特种兵
displayText       : 特种兵
displayDescription: [对地]\n-早期廉价的对地单位, 但集群后火力同样凶猛\n-子弹关天, 但人命廉价
displayDescription_ja = [Earth] \ n-hearly安い土地ユニットですが、クラスター\ n-bulletが閉じた後も火力も激しいですが、命は安いです
defineUnitMemory  : float maxAttackRange
maxHp             : 1300
isBuilder         : true
selfRegenRate     : 1
energyMax         : 1
energyRegen       : 0.01
price             : 1000,hero=1
buildSpeed:30s

[graphics]
image_turret    : M4A1.png
turretImageScale:0.8



[hiddenAction_点数]
text:点数
autoTriggerOnEvent:destroyed
addResources:hero=1

[attack]
maxAttackRange          : 160
canAttack               : true
canAttackFlyingUnits    : false
canAttackLandUnits      : true
canAttackUnderwaterUnits: false
showRangeUIGuide        : true
#isMelee                 : true
#meleeEngangementDistance: ${attack.maxAttackRange}
isFixedFiring           : false


[turret_1]
x                 : 0
y                 : 5
shoot_light       : #FFAA0000
recoilOffset      : -3
recoilOutTime     : 2
recoilReturnTime  : 10
delay             : 30
resourceUsage     : qwq=1
shoot_sound       : 发射.ogg
canAttackCondition: if not self.hasFlag(id=2)

[projectile_1]
life:100
directDamage:51

drawSize:0.7
lightSize:0.3
lightColor:#AAFF6666
speed:7
explodeEffect:smoke
image:子弹.png
[movement]
moveSpeed:0.82

[ai]
buildPriority:0.8





# ========================================================================================================================================== 



[action_putBoob]
text       : 放置炸弹
description: 放置一枚威力巨大的炸弹, 对各种单位都有很好的毁伤效果\n但要是爆炸前就被敌人摧毁就不好了
price      : 50,energy=0.5
fireTurretXAtGround:boom
buildSpeed:0.2s

[turret_boom]
x:0
y:0
image:空.png
projectile:boom
canShoot:false


[projectile_boom]
directDamage:0
life:100000
speed:5
image:雷管.png
targetGround:true
spawnUnit:雷管2


# =========================================================================================================================================== 


[resource_qwq]
hidden            : true
displayRoundedDown: true



[action_reload_1]
text           : reload
autoTrigger    : if self.resource.qwq==0
playSoundAtUnit: 换弹.wav
alsoQueueAction: reload_2
buildSpeed     : 0s
addResources   : setFlag=2

[hiddenAction_reload_2]
buildSpeed:2s
setResourcesWithLogic: qwq=31
alsoTriggerAction:reload_3

[hiddenAction_reload_3]
buildSpeed:0s
addResources:unsetFlag=2

[global_resource_hero]
hidden:false

[decal_1]
total_frames        : 10
onlyWhileAlive      : true
frame               : int(self.resource.qwq)%10
xOffsetAbsolute     : -10
yOffsetAbsolute     : 5
layer               : onTop
alpha               : 1
image               : 0-9.png
alwaysStartDirAtZero: true

[decal_2]
total_frames        : 10
onlyWhileAlive      : true
frame               : int(self.resource.qwq/10)%10
xOffsetAbsolute     : -14
yOffsetAbsolute     : 5
layer               : onTop
alpha               : 1
image               : 0-9.png
alwaysStartDirAtZero: true

