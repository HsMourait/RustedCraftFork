[core]
dont_load:true

[action_返航]
text:返航
displayType:action
buildSpeed:1s
pos:0.1
autoTrigger:if not self.isAtGroundHeight and self.energy(equalTo=0)
isVisible:false
addWaypoint_type:loadInto

addWaypoint_target_nearestUnit_team:own
addWaypoint_target_nearestUnit_tagged:空载机枪快艇


[action_结束]
text:结束
displayType:action
buildSpeed:0
pos:0.4
isVisible:false
clearAllWaypoints:true
autoTrigger:if self.energy(lessThan=1) and self.hasFlag(id=3)

addResources:unsetFlag=3


[action_装弹]
text:装弹
displayType:action
buildSpeed:1
pos:0.6
autoTrigger:if self.isAtGroundHeight
isVisible:false
addResources:energy=0.1, setFlag=3
