[core]
dont_load:true

[hiddenAction_BeFlash]
autoTriggerOnEvent: tookDamage(withTag='flash')
clearAllWaypoints : true
requireConditional:if not self.hasFlag(id=6)
addResources:setFlag=6
setUnitStats: armour=0,movespeed=0,maxTurnSpeed=0,maxAttackRange=0
alsoQueueAction:return


[hiddenAction_return]
buildSpeed        : 1s
requireConditional: if self.hasFlag(id=6) and self.teamId() != -2
addResources:unsetFlag=6
resetUnitStats    : true
alsoTriggerAction:reset